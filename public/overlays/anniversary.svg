<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 520" fill="none">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="firework" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fireworks corners -->
  <circle cx="120" cy="100" r="50" fill="url(#firework)" opacity="0.8"/>
  <line x1="120" y1="50" x2="120" y2="30" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="150" x2="120" y2="170" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="100" x2="50" y2="100" stroke="#FF8F00" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="100" x2="190" y2="100" stroke="#FF8F00" stroke-width="3" stroke-linecap="round"/>
  <line x1="85" y1="65" x2="70" y2="50" stroke="#E91E63" stroke-width="2" stroke-linecap="round"/>
  <line x1="155" y1="135" x2="170" y2="150" stroke="#E91E63" stroke-width="2" stroke-linecap="round"/>
  <circle cx="1800" cy="95" r="45" fill="url(#firework)" opacity="0.8"/>
  <line x1="1800" y1="50" x2="1800" y2="32" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>
  <line x1="1755" y1="95" x2="1735" y2="95" stroke="#FF8F00" stroke-width="3" stroke-linecap="round"/>
  <line x1="1845" y1="95" x2="1865" y2="95" stroke="#FF8F00" stroke-width="3" stroke-linecap="round"/>
  <!-- Medal plaque center -->
  <circle cx="960" cy="130" r="95" fill="#FFF8E1" stroke="#FFB300" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="960" cy="130" r="75" fill="none" stroke="#FFD54F" stroke-width="2"/>
  <rect x="860" y="200" width="200" height="50" rx="8" fill="#FFF8E1" stroke="#FFB300" stroke-width="3"/>
  <!-- Serpentines sides -->
  <path d="M0 180 Q80 220 40 300 Q20 360 60 400" stroke="#E91E63" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M1920 175 Q1840 215 1880 295 Q1900 355 1860 395" stroke="#7E57C2" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M15 250 Q50 280 30 320" stroke="#FFD54F" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M1905 245 Q1870 275 1890 315" stroke="#4FC3F7" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Confetti dots -->
  <circle cx="200" cy="250" r="5" fill="#E91E63"/>
  <circle cx="1720" cy="240" r="5" fill="#7E57C2"/>
  <rect x="250" y="270" width="8" height="8" fill="#FFD54F" transform="rotate(30 254 274)"/>
  <rect x="1660" y="265" width="8" height="8" fill="#4FC3F7" transform="rotate(-20 1664 269)"/>
</svg>
